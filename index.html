<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6fa"><meta name="description" content="雪餅羽もえの個人撮影会の情報をまとめたページ"><title>もえの撮影会情報</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/moe-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/moe-192.png">
<link rel="stylesheet" href="style.css?v=two-photos-1"></head><body><header><div class="wrap"><h1>もえの撮影会情報</h1></div></header><main class="wrap"><section aria-labelledby="heading"><div class="section-heading"><h2 id="heading">撮影会一覧</h2><button id="refresh" type="button">再読み込み</button></div><p id="updated" class="meta" role="status">情報を読み込み中…</p><div class="filters" id="filters" hidden><div class="filter-search"><label for="query">名前・会場・日付で検索</label><input id="query" type="search"></div><div class="filter-period"><label for="period">表示範囲</label><select id="period"><option value="upcoming">これから</option><option value="past">過去3か月</option></select></div>
<fieldset id="event-view" class="view-picker">
  <legend>表示形式</legend>
  <div class="view-choices">
    <label><input type="radio" name="event-view" value="list" checked><span>一覧</span></label>
    <label><input type="radio" name="event-view" value="calendar"><span>カレンダー</span></label>
    <label><input type="radio" name="event-view" value="compact"><span>コンパクト</span></label>
  </div>
</fieldset></div><p class="booking-note">最新の予約状況は主催者の公式ページへ。</p><div id="events" aria-live="polite"></div></section><section class="sources"><h2>主催者の公式サイト</h2><div class="links"><a href="https://photo-f.cotori-pr.com/" target="_blank" rel="noopener noreferrer">ことり撮影会 ↗</a><a href="https://www.smooth-tokyo.jp/" target="_blank" rel="noopener noreferrer">Smooth ↗</a><a href="https://www.fresh-club.net/premium/" target="_blank" rel="noopener noreferrer">Fresh ↗</a><a href="https://photo-session-chance.com/" target="_blank" rel="noopener noreferrer">CHANCE ↗</a></div></section><a class="litlink" href="https://lit.link/nowan_moe0121" target="_blank" rel="noopener noreferrer">もえのリンク集 ↗</a></main>
<dialog id="event-detail" aria-labelledby="detail-heading">
  <div class="dialog-heading"><h2 id="detail-heading">予定の詳細</h2><button type="button" autofocus>閉じる</button></div>
  <div class="detail-body"></div>
</dialog>
<dialog id="announcement" aria-labelledby="announcement-heading">
  <div class="dialog-heading">
    <h2 id="announcement-heading">SNS告知を作る</h2><button type="button" class="close-dialog" autofocus>閉じる</button>
    <div class="mobile-announcement-nav" role="group" aria-label="告知画面の移動">
      <button type="button" class="jump-poster" disabled>画像・保存へ</button>
      <button type="button" class="jump-message">投稿文へ</button>
    </div>
  </div>
  <p class="event-name"></p>
  <div class="design-tools">
    <button type="button" class="copy-message">投稿文をコピー</button>
    <button type="button" class="view-message">投稿文を見る</button>
    <button type="button" class="shuffle">デザインを変える</button>
    <button type="button" class="edit-poster" aria-haspopup="dialog">細かく調整</button>
    <label class="format-label">画像サイズ<select id="poster-format">
      <option value="story">縦長（9:16）</option><option value="feed">フィード（4:5）</option><option value="square">正方形（1:1）</option>
    </select></label>
  </div>
  <p class="post-copy-status" role="status"></p>
  <div class="poster-pickers">
    <button type="button" class="choose-photo" aria-haspopup="dialog"><span>写真を選ぶ</span><small></small></button>
    <button type="button" class="choose-design" aria-haspopup="dialog"><span>デザインを選ぶ</span><small></small></button>
  </div>
  <p class="announce-feedback" role="status" aria-live="polite"></p>
  <div class="poster-preview" aria-label="告知画像"></div>
  <div class="message-heading">
    <label class="message-label" for="social-message">SNS投稿文</label>
    <button type="button" class="mobile-copy-message" aria-label="投稿文をコピー">コピー</button>
    <button type="button" class="select-message">投稿文を全選択</button>
  </div>
  <p id="post-manual-status" class="post-copy-status" role="status"></p>
  <textarea id="social-message" rows="8" readonly aria-describedby="post-manual-status"></textarea>
  <div class="design-tools">
    <button type="button" class="copy-skill-prompt">ChatGPTスキル用の依頼文をコピー</button>
  </div>
  <p class="skill-prompt-feedback" role="status"></p>
  <p class="meta">ChatGPTのWorkモードで「@」から「雪餅羽もえ 撮影会告知画像」を選び、依頼文を貼り付けてください。</p>
  <details class="skill-prompt-preview">
    <summary>依頼文を確認・手動コピー</summary>
    <textarea id="skill-prompt" aria-label="ChatGPTスキル用の依頼文" rows="8" readonly></textarea>
  </details>
</dialog>
<dialog id="poster-picker" aria-labelledby="poster-picker-heading">
  <div class="dialog-heading">
    <h2 id="poster-picker-heading"></h2>
    <div class="picker-heading-actions">
      <button type="button" class="apply-photo-pair" hidden disabled>2枚を反映</button>
      <button type="button" class="close-picker" autofocus>戻る</button>
    </div>
  </div>
  <div class="poster-picker-actions">
    <button type="button" class="photo-pair-mode" aria-pressed="false" hidden>写真を2枚使う</button>
    <button type="button" class="reset-photo-pair" hidden>選び直す</button>
    <button type="button" class="auto-choice">おまかせで選ぶ</button>
    <label class="format-label theme-filter" hidden>雰囲気<select></select></label>
    <button type="button" class="blank-photo">写真枠を空欄にする</button>
    <label class="upload-photo">端末の写真<input type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" aria-describedby="upload-photo-formats"></label>
  </div>
  <p id="upload-photo-formats" class="upload-photo-formats" hidden>JPEG・PNG・WebP、1枚12MBまで</p>
  <p class="poster-picker-status" role="status" hidden></p>
  <section class="local-photo-preview" aria-label="選んだ写真の確認" hidden>
    <div class="local-photo-image"></div>
    <p class="local-photo-name"></p>
    <div class="local-photo-actions">
      <button type="button" class="use-local-photo">この写真を使う</button>
      <button type="button" class="cancel-local-photo">取り消す</button>
    </div>
  </section>
  <p class="current-photo" role="status" hidden></p>
  <div class="photo-filters" hidden>
    <label>写真を検索<input type="search" class="photo-query" placeholder="写真の名前"></label>
    <label>衣装<select class="photo-outfit">
      <option value="">すべて</option><option value="kimono">和装</option><option value="swim">水着</option><option value="animal">アニマル</option>
      <option value="dress">ドレス</option><option value="uniform">制服</option><option value="casual">私服</option><option value="costume">その他の衣装</option>
    </select></label>
  </div>
  <p class="photo-results" role="status" hidden></p>
  <button type="button" class="clear-photo-filters" hidden>絞り込みを解除</button>
  <div class="poster-choices"></div>
  <button type="button" class="more-photos" hidden>写真をさらに表示</button>
</dialog>
<dialog id="poster-editor" aria-labelledby="poster-editor-heading">
  <div class="dialog-heading"><h2 id="poster-editor-heading">告知画像の調整</h2><button type="button" class="cancel-poster-edit" autofocus>戻る</button></div>
  <div class="poster-edit-body">
    <div class="poster-edit-preview" aria-label="告知画像のプレビュー">
      <div class="poster-edit-canvas"></div>
      <p class="crop-gesture-hint">1本指で移動・2本指で拡大／縮小</p>
    </div>
    <div class="mobile-edit-tabs" role="group" aria-label="調整する項目">
      <button type="button" data-edit-tab="layout" aria-pressed="true">配色・配置</button>
      <button type="button" data-edit-tab="text" aria-pressed="false">文字・背景</button>
      <button type="button" data-edit-tab="crop" aria-pressed="false">切り取り</button>
    </div>
    <div class="poster-edit-controls">
      <fieldset data-edit-panel="layout">
        <legend>配色と配置</legend>
        <div class="poster-palettes" role="group" aria-label="配色"></div>
        <label class="format-label">配置<select id="poster-layout"></select></label>
        <button type="button" class="flip-poster">左右を反転</button>
      </fieldset>
      <fieldset data-edit-panel="text">
        <legend>文字と背景</legend>
        <label class="format-label">文字演出<select id="poster-lettering"><option value="">テーマに合わせる</option></select></label>
        <label class="format-label">見出しの書体<select id="poster-typeface"><option value="">テーマに合わせる</option><option value="serif">明朝体</option><option value="sans">ゴシック体</option></select></label>
        <label class="format-label">文字サイズ<select id="poster-type-size"><option value="">おまかせ</option><option value="large">大きめ</option></select></label>
        <label class="format-label">背景の柄<select id="poster-pattern">
          <option value="">テーマに合わせる</option><option value="none">柄なし</option>
        </select></label>
      </fieldset>
      <fieldset class="poster-crop" data-edit-panel="crop">
        <legend>写真の切り取り</legend>
        <label class="format-label crop-photo-target" hidden>調整する写真<select>
          <option value="0">1枚目</option><option value="1">2枚目</option>
        </select></label>
        <label class="photo-fit"><input type="checkbox" name="fit">写真全体を収める</label>
        <label>拡大 <input type="range" name="zoom" min="1" max="2.5" step="0.05" value="1"><span data-crop-value="zoom" aria-hidden="true">100%</span></label>
        <label>横位置 <input type="range" name="x" min="0" max="1" step="0.01" value="0.5"><span data-crop-value="x" aria-hidden="true">50%</span></label>
        <label>縦位置 <input type="range" name="y" min="0" max="1" step="0.01" value="0.28"><span data-crop-value="y" aria-hidden="true">28%</span></label>
        <div class="crop-actions">
          <button type="button" class="center-crop">中央に寄せる</button>
          <button type="button" class="reset-crop">切り取りを戻す</button>
        </div>
      </fieldset>
    </div>
  </div>
  <div class="poster-edit-actions">
    <button type="button" class="reset-poster-edit">標準に戻す</button>
    <button type="button" class="apply-poster-edit">反映する</button>
  </div>
</dialog>
<script type="module" src="app.js?v=ac3093c9c1cf75ab"></script></body></html>
