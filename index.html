<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6fa"><meta name="description" content="雪餅羽もえの個人撮影会の情報をまとめたページ"><title>もえの撮影会情報</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/moe-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/moe-192.png">
<link rel="stylesheet" href="style.css?v=gallery-1"></head><body><header><div class="wrap"><h1>もえの撮影会情報</h1></div></header><main class="wrap"><section aria-labelledby="heading"><div class="section-heading"><h2 id="heading">撮影会一覧</h2><button id="refresh" type="button">再読み込み</button></div><p id="updated" class="meta" role="status">情報を読み込み中…</p><div class="filters" id="filters" hidden><div class="filter-search"><label for="query">名前・会場・日付で検索</label><input id="query" type="search"></div><div class="filter-period"><label for="period">表示範囲</label><select id="period"><option value="upcoming">これから</option><option value="past">過去3か月</option></select></div>
<fieldset id="event-view" class="view-picker">
  <legend>表示形式</legend>
  <div class="view-choices">
    <label><input type="radio" name="event-view" value="list" checked><span>一覧</span></label>
    <label><input type="radio" name="event-view" value="calendar"><span>カレンダー</span></label>
    <label><input type="radio" name="event-view" value="compact"><span>コンパクト</span></label>
  </div>
</fieldset></div><p class="booking-note">最新の予約状況は主催者の公式ページへ。</p><div class="intake"><a href="https://docs.google.com/forms/d/e/1FAIpQLSc4GE4b6tEV-ytBTng537AYwKwCELpoAjh1SHR-U6_fE2nfhA/viewform" rel="noopener noreferrer" target="_blank">情報源の画像・URLを送る ↗</a><small>管理者専用の受付先へ送信します。Google ログインが必要です。</small></div><div id="events" aria-live="polite"></div></section><section class="sources"><h2>主催者の公式サイト</h2><div class="links"><a href="https://photo-f.cotori-pr.com/" target="_blank" rel="noopener noreferrer">ことり撮影会 ↗</a><a href="https://www.smooth-tokyo.jp/" target="_blank" rel="noopener noreferrer">Smooth ↗</a><a href="https://www.fresh-club.net/premium/" target="_blank" rel="noopener noreferrer">Fresh ↗</a><a href="https://photo-session-chance.com/" target="_blank" rel="noopener noreferrer">CHANCE ↗</a></div></section><a class="litlink" href="https://lit.link/nowan_moe0121" target="_blank" rel="noopener noreferrer">もえのリンク集 ↗</a></main>
<dialog id="event-detail" aria-labelledby="detail-heading">
  <div class="dialog-heading"><h2 id="detail-heading">予定の詳細</h2><button type="button" autofocus>閉じる</button></div>
  <div class="detail-body"></div>
</dialog>
<dialog id="announcement" aria-labelledby="announcement-heading">
  <div class="dialog-heading"><h2 id="announcement-heading">SNS告知を作る</h2><button type="button" class="close-dialog" autofocus>閉じる</button></div>
  <p class="event-name"></p>
  <div class="design-tools">
    <button type="button" class="copy-message">投稿文をコピー</button>
    <button type="button" class="shuffle">デザインを変える</button>
    <label class="format-label">デザイン<select id="poster-style">
      <option value="">おまかせ</option>
    </select></label>
    <label class="format-label">画像サイズ<select id="poster-format">
      <option value="story">縦長（9:16）</option><option value="feed">フィード（4:5）</option>
    </select></label>
    <details><summary>写真を変更</summary><div class="photo-tools">
      <label>参考写真 <select id="poster-photo"><option value="">おまかせ</option></select></label>
      <button type="button" class="auto-photo">参考写真から選び直す</button>
      <button type="button" class="blank-photo">写真枠を空欄にする</button>
      <label>端末の写真を使う<input type="file" accept="image/jpeg,image/png,image/webp"></label>
      <small>選んだ写真はこの告知にだけ使います。</small>
    </div></details>
  </div>
  <p class="announce-feedback" role="status" aria-live="polite"></p>
  <p class="poster-save-tip">保存したい画像を長押しして、メニューから保存してください。</p>
  <div class="poster-preview" aria-label="告知画像"></div>
  <label class="message-label" for="social-message">SNS投稿文</label>
  <textarea id="social-message" rows="8" readonly></textarea>
</dialog>
<script type="module" src="app.js?v=gallery-1"></script></body></html>
